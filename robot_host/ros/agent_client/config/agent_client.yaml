car_agent_client:
  ros__parameters:
    audio_device: plughw:CARD=USB,DEV=0
    playback_device: plughw:CARD=USB,DEV=0
    sample_rate: 16000
    channels: 1
    period_frames: 320
    vad_energy_threshold: 500
    vad_min_speech_ms: 300
    vad_silence_ms: 600
    vad_preroll_ms: 500
    max_speech_seconds: 15
    # Agent Server 重启或网络中断时，超时后自动恢复语音监听。
    agent_request_timeout_seconds: 120.0
    # 模型不能覆盖下列本地安全限制和执行参数。
    motion_max_distance_m: 2.0
    motion_max_rotation_deg: 180.0
    motion_linear_speed_mps: 0.2
    motion_timeout_seconds: 15.0
