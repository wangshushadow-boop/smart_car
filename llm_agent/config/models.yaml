# 模型实例、隔离环境和推理参数的统一清单。密钥只通过环境变量提供。
models:
  minicpm:
    backend: minicpm
    roles: [generation_model]
    input: [text, image, audio, video]
    base_url: http://127.0.0.1:8099/v1
    model: /mnt/d/AI/models/MiniCPM-o-4_5-AWQ
    python: /mnt/d/work/smart_car/llm_agent/py_env/venvs/minicpm/bin/python
    device: cuda:0
    timeout_seconds: 90
    max_retries: 1
    response_max_tokens: 256
    response_temperature: 0.2
    deployment:
      local: true
      # 通用参数数组由启动器原样执行；新增模型时不需要修改 Python 代码。
      command:
        - /mnt/d/work/smart_car/llm_agent/py_env/venvs/minicpm/bin/vllm
        - serve
        - /mnt/d/AI/models/MiniCPM-o-4_5-AWQ
        - --omni
        - --host
        - 0.0.0.0
        - --port
        - 8099
        - --deploy-config
        - /mnt/d/work/smart_car/llm_agent/config/minicpmo_4_5_awq_3090.yaml
      health_url: http://127.0.0.1:8099/health
      startup_timeout_seconds: 180

  minimax:
    backend: minimax
    roles: [generation_model, speech]
    input: [text, image]
    protocol: openai
    base_url: https://api.minimaxi.com/v1
    model: MiniMax-M3
    timeout_seconds: 90
    max_retries: 1
    response_max_tokens: 2048
    response_temperature: 0.2
    reasoning_split: true
    speech_url: https://api.minimaxi.com/v1/t2a_v2
    speech_model: speech-2.8-turbo
    voice_id: Chinese (Mandarin)_Reliable_Executive
    sample_rate: 32000
    speech_timeout_seconds: 60
    deployment:
      local: false

  qwen3_asr:
    backend: qwen3_asr
    roles: [asr]
    input: [audio]
    endpoint: http://127.0.0.1:8100
    language: Chinese
    timeout_seconds: 120
    deployment:
      local: true
      command:
        - /mnt/d/work/smart_car/llm_agent/py_env/venvs/qwen3-asr/bin/python
        - -m
        - llm_agent.models.providers.qwen3_asr.server
        - --model
        - /mnt/d/AI/models/Qwen3-ASR-0.6B
        - --device
        - cuda:0
        - --host
        - 127.0.0.1
        - --port
        - 8100
      health_url: http://127.0.0.1:8100/health
      startup_timeout_seconds: 180

  piper:
    backend: piper
    roles: [speech]
    input: []
    endpoint: http://127.0.0.1:8101
    timeout_seconds: 30
    deployment:
      local: true
      command:
        - /mnt/d/work/smart_car/llm_agent/py_env/venvs/agent/bin/python
        - -m
        - llm_agent.models.providers.piper.server
        - --model
        - /mnt/d/AI/models/piper/zh_CN-huayan-medium/zh_CN-huayan-medium.onnx
        - --config
        - /mnt/d/AI/models/piper/zh_CN-huayan-medium/zh_CN-huayan-medium.onnx.json
        - --host
        - 127.0.0.1
        - --port
        - 8101
      health_url: http://127.0.0.1:8101/health
      startup_timeout_seconds: 30
