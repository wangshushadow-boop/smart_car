# Secrets stay in environment variables.  MINIMAX_API_KEY is never stored here.
generation:
  provider: minicpm

speech:
  # auto: prefer the generation provider's standalone speech capability, then use fallback.
  # MiniCPM-o does not expose safe standalone TTS in the current vLLM-Omni service,
  # so the default MiniCPM generation configuration resolves to Piper.
  # Other choices: piper, minimax, native, same_provider.
  provider: auto
  preferred: same_provider
  fallback: piper

runtime:
  # 防止调用方把过大的媒体直接塞入 DDS Action Goal。
  max_inline_bytes: 67108864
  # 短期多轮上下文只保存在 Agent Server 内存中，重启后自动清空。
  conversation_enabled: true
  conversation_max_turns: 8
  conversation_max_context_chars: 12000
  conversation_ttl_seconds: 1800
  conversation_max_sessions: 128

providers:
  minicpm:
    base_url: http://127.0.0.1:8099/v1
    model: /mnt/d/AI/models/MiniCPM-o-4_5-AWQ
    timeout_seconds: 90
    max_retries: 1

  minimax:
    base_url: https://api.minimax.io/v1
    model: MiniMax-M2.7
    timeout_seconds: 90
    max_retries: 1
    speech_url: https://api.minimax.io/v1/t2a_v2
    speech_model: speech-2.8-turbo
    voice_id: Chinese (Mandarin)_Reliable_Executive
    sample_rate: 32000
    speech_timeout_seconds: 60

  piper:
    model: /home/llm_agent/.local/share/piper/zh_CN-huayan-medium/zh_CN-huayan-medium.onnx
    config: /home/llm_agent/.local/share/piper/zh_CN-huayan-medium/zh_CN-huayan-medium.onnx.json
    timeout_seconds: 30
