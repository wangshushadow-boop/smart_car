# 模型实例、隔离环境和推理参数的统一清单。密钥只通过环境变量提供。
models:
  minicpm:
    backend: minicpm
    roles: [generation_model]
    base_url: http://127.0.0.1:8099/v1
    model: /mnt/d/AI/models/MiniCPM-o-4_5-AWQ
    python: /mnt/d/work/smart_car/llm_agent/py_env/venvs/minicpm/bin/python
    device: cuda:0
    timeout_seconds: 90
    max_retries: 1
    intent_max_tokens: 160
    intent_temperature: 0.0
    response_max_tokens: 256
    response_temperature: 0.2

  minimax:
    backend: minimax
    roles: [generation_model, speech]
    protocol: openai
    base_url: https://api.minimaxi.com/v1
    model: MiniMax-M3
    timeout_seconds: 90
    max_retries: 1
    intent_max_tokens: 2048
    intent_temperature: 0.01
    response_max_tokens: 2048
    response_temperature: 0.2
    reasoning_split: true
    speech_url: https://api.minimaxi.com/v1/t2a_v2
    speech_model: speech-2.8-turbo
    voice_id: Chinese (Mandarin)_Reliable_Executive
    sample_rate: 32000
    speech_timeout_seconds: 60

  qwen3_asr:
    backend: qwen3_asr
    roles: [asr]
    python: /mnt/d/work/smart_car/llm_agent/py_env/venvs/qwen3-asr/bin/python
    model: /mnt/d/AI/models/Qwen3-ASR-0.6B
    device: cuda:0
    language: Chinese
    timeout_seconds: 120

  piper:
    backend: piper
    roles: [speech]
    model: /mnt/d/AI/models/piper/zh_CN-huayan-medium/zh_CN-huayan-medium.onnx
    config: /mnt/d/AI/models/piper/zh_CN-huayan-medium/zh_CN-huayan-medium.onnx.json
    timeout_seconds: 30
