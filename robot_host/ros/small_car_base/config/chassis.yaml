# 底盘标定参数记录。
# 每次确认参数后同步修改本文件并提交 Git，避免实验结果丢失。
# 上位机每次启动时都会加载全部参数、下发到 MCU 并回读校验。
# 所有参数都可通过 ros2 param set 在线标定；确认后仍需把最终值写回本文件。
small_car:
  ros__parameters:
    # 参数 ID 1：里程计每个编码器计数对应毫米数的分子，分母固定为 15600。
    odom_mm_per_tick_num: 2166

    # 参数 ID 2：手柄前进方向开始驱动时的电机输出，范围 0-1000。
    gamepad_forward_start: 550

    # 参数 ID 3：手柄后退方向开始驱动时的电机输出，范围 0-1000。
    gamepad_reverse_start: 320

    # 参数 ID 4：手柄前后方向最大电机输出，范围 0-1000。
    gamepad_drive_max: 800

    # 参数 ID 5：手柄转向开始生效时的转向输出，范围 0-1000。
    gamepad_turn_start: 620

    # 参数 ID 6：手柄转向最大输出，范围 0-1000。
    gamepad_turn_max: 850

    # 参数 ID 7：超声避障距离阈值，单位为毫米。
    ultra_near_distance_mm: 200

    # 参数 ID 8：ICM20948 陀螺仪灵敏度乘以 10，当前 +/-2000 dps 对应 164。
    gyro_lsb_per_dps_x10: 164

    # 参数 ID 9：左右轮中心的有效轮距，单位毫米，必须大于 0。
    wheel_track_mm: 115

    # 参数 ID 10：航向增量中陀螺仪的权重，范围 0-1000。
    yaw_gyro_weight_permille: 900

    # 参数 ID 11：roll/pitch 互补滤波中陀螺仪的权重，范围 0-1000。
    attitude_gyro_weight_permille: 980

    # 参数 ID 12：IMU 安装横滚偏置，单位 mdeg；平地静止标定后填写。
    imu_roll_offset_mdeg: -2050

    # 参数 ID 13：IMU 安装俯仰偏置，单位 mdeg；平地静止标定后填写。
    imu_pitch_offset_mdeg: 990

    # 参数 ID 14：ROS 前进速度上限，单位 mm/s；当前已验证为 0.6 m/s。
    max_linear_speed_mm_s: 600

    # 参数 ID 15：ROS 转向角速度上限，单位 mrad/s；对应 2.0 rad/s。
    max_angular_speed_mrad_s: 2000

    # 参数 ID 16：ROS/上位机控制是否启用编码器轮速闭环；手柄不受此参数影响。
    wheel_speed_closed_loop_enabled: 1

    # 参数 ID 17：轮速比例增益 Kp x100；50 表示 0.50 PWM/(mm/s)。
    wheel_speed_kp_x100: 50

    # 参数 ID 18：轮速积分增益 Ki x100；20 表示 0.20 PWM/(mm/s*s)。
    wheel_speed_ki_x100: 20

    # 参数 ID 19：积分绝对值上限，防止停车或堵转后积分持续累积。
    wheel_speed_integral_limit: 1000

    # 参数 ID 20：左右轮目标速度的最大变化率，单位 mm/s^2。
    wheel_accel_limit_mm_s2: 500

    # 参数 ID 21：电机非零输出的最小 PWM，克服低速静摩擦。
    wheel_pwm_min: 580

    # 参数 ID 22：左侧电机输出修正，1000 表示 100%。
    wheel_left_output_permille: 1000

    # 参数 ID 23：右侧电机输出修正，1000 表示 100%。
    wheel_right_output_permille: 1000

    # 参数 ID 24：原地转向起步 PWM；触发后短时保持，再恢复 wheel_pwm_min。
    wheel_turn_start_pwm: 750
