# MiniCPM-o 4.5 AWQ 在 RTX 3090 24GB 上的单车单会话配置。
pipeline: minicpmo_4_5
async_chunk: true

trust_remote_code: true
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3

stages:
  # 多模态理解与文本生成。
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.60
    enforce_eager: false
    tensor_parallel_size: 1
    max_model_len: 4096
    max_num_batched_tokens: 4096
    devices: "0"
    limit_mm_per_prompt:
      image: 8
      audio: 8
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 1024
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

  # 文本到语音编码。
  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: false
    max_num_batched_tokens: 4096
    devices: "0"
    output_connectors:
      to_stage_2: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      min_tokens: 50
      max_tokens: 2048
      stop_token_ids: [1]
      seed: 42
      detokenize: false

  # 语音编码到 24 kHz 波形。
  - stage_id: 2
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 16384
    max_model_len: 16384
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 16384
      detokenize: true

platforms:
  cuda:
    stages:
      - stage_id: 1
        kv_cache_memory_bytes: 1073741824  # 1 GiB
